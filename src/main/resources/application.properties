# 本地钱包交易构建服务
spring.application.name=wallet-coin-selection

# 费用模型（金额单位 sat，费率单位 sat/kB）
wallet.fee-rate-per-kb=1000
wallet.long-term-fee-rate-per-kb=500
wallet.max-fee-rate-per-kb=10000
wallet.input-size=148
wallet.output-size=34
wallet.overhead-size=10
wallet.min-change=546

# 默认挑选策略：MIN_INPUTS | LONG_TERM | MIN_CHANGE
wallet.default-strategy=MIN_INPUTS

# 构建占用租约时长（毫秒）：超时后占用可被其他构建获取
wallet.build-lease-millis=60000

# 本地状态文件（重启恢复用）
wallet.state-file=data/wallet-state.json
